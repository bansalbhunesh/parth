name: Pramaan CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: error

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and quality toolchain
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Lint and strict type boundaries
        run: |
          python -m ruff check .
          python -m mypy
      - name: Architecture, interface, and protected-scope gates
        run: |
          python scripts/check_architecture.py
          python scripts/export_openapi.py --check
          python scripts/check_protected_scope.py
      - name: Dependency and code security scans
        run: |
          python -m pip_audit --local
          python -m bandit -r backend/ scripts/ --severity-level medium
      - name: Backend tests and ratcheted coverage
        run: |
          python -m pytest tests/ -q --tb=short --cov=backend --cov-branch --cov-report=term-missing --cov-report=xml:coverage-backend.xml --cov-report=json:coverage-backend.json
          python scripts/check_coverage_thresholds.py coverage-backend.json --lines 86 --branches 75
      - name: Verify benchmark evidence
        run: |
          python scripts/benchmark_manifest_check.py
          python scripts/benchmark_hash_sources.py
          python scripts/benchmark_calibration.py
          git diff --exit-code benchmarks/ps4_external_v1/reports/calibration_report.md benchmarks/ps4_external_v1/reports/calibration.json
          python eval/run_eval.py
          python eval/multi_project_eval.py
          python eval/text_eval.py
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage-backend.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Type, component coverage, audit, and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run quality:design
          npm run test:coverage
          npm audit --audit-level=high
          npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and browser engines
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
      - name: Chromium, Firefox, WebKit, Pixel, and iPhone journeys
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build non-root digest-pinned images
        run: |
          docker build -f Dockerfile.backend -t pramaan-backend:${{ github.sha }} .
          docker build --target frontend -t pramaan-frontend:${{ github.sha }} .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: pramaan-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: pramaan-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Smoke-test backend health and OCR
        run: |
          docker run -d --name pramaan-test -p 8000:8000 pramaan-backend:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health/ready && break || sleep 2; done
          curl -sf http://localhost:8000/ocr-check | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ready', d"
          docker stop pramaan-test

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: pramaan-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pramaan-sbom
          path: pramaan-sbom.cdx.json
          retention-days: 30
