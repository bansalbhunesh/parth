name: Pramaan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff pip-audit bandit
      - name: Lint (ruff)
        run: ruff check .
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --local
      - name: Security scan (bandit)
        # Medium+ only: 7 pre-existing LOW findings (subprocess usage,
        # try/except/pass in maintainer scripts) are informational and not
        # gated. Known-accepted B310 urlopen mediums are suppressed inline
        # with `# nosec B310` at each exact call site (fixed, hardcoded
        # URLs in verification scripts, not user-controllable input) — any
        # NEW or different medium/high finding still fails this step.
        run: bandit -r backend/ scripts/ --severity-level medium
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=term-missing
      - name: Verify benchmark manifest and source hashes
        run: |
          python scripts/benchmark_manifest_check.py
          python scripts/benchmark_hash_sources.py
      - name: Run single-project eval
        run: python eval/run_eval.py
      - name: Run multi-project eval
        run: python eval/multi_project_eval.py
      - name: Run text-based eval (non-circular)
        run: python eval/text_eval.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci 2>/dev/null || npm install
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Component tests
        working-directory: frontend
        run: npm test
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build
        working-directory: frontend
        run: npm run build

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci 2>/dev/null || npm install
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Upload, paste, streamed findings, evidence links, keyboard nav, mobile layout.
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (OCR-capable, Dockerfile.backend)
        run: docker build -f Dockerfile.backend -t pramaan-backend .
      - name: Build frontend image
        run: docker build --target frontend -t pramaan-frontend .
      - name: Smoke test backend — health + OCR ready
        run: |
          docker run -d --name pramaan-test -p 8000:8000 pramaan-backend
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          curl -sf http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'], 'health check failed'"
          # The Dockerfile.backend image installs tesseract, so OCR must be live here.
          curl -sf http://localhost:8000/ocr-check | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ready', d; assert d['ocr_available'] is True, d; print('OCR ready in image:', d['tesseract_version'])"
          docker stop pramaan-test
