name: Pramaan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=term-missing
      - name: Run single-project eval
        run: python eval/run_eval.py
      - name: Run multi-project eval
        run: python eval/multi_project_eval.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci 2>/dev/null || npm install
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target backend -t pramaan-backend .
      - name: Build frontend image
        run: docker build --target frontend -t pramaan-frontend .
      - name: Smoke test backend
        run: |
          docker run -d --name pramaan-test -p 8000:8000 pramaan-backend
          sleep 3
          curl -sf http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'], 'health check failed'"
          docker stop pramaan-test
