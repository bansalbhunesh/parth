name: Pramaan CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and quality toolchain
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Lint and strict type boundaries
        run: |
          python -m ruff check .
          python -m mypy
      - name: Architecture, interface, and protected-scope gates
        run: |
          python scripts/check_architecture.py
          python scripts/export_openapi.py --check
          python scripts/check_protected_scope.py
      - name: Dependency and code security scans
        run: |
          python -m pip_audit -r backend/requirements.lock --disable-pip --strict
          python -m pip_audit -r backend/requirements-dev.lock --disable-pip --strict
          python -m bandit -r backend/ scripts/ --severity-level medium
      - name: Backend tests and ratcheted coverage
        run: |
          python -m pytest tests/ -q --tb=short --cov=backend --cov-branch --cov-report=term-missing --cov-report=xml:coverage-backend.xml --cov-report=json:coverage-backend.json
          python scripts/check_coverage_thresholds.py coverage-backend.json --lines 95 --branches 90 \
            --min-file-lines 80 --min-file-branches 65 \
            --exempt backend/agents/ocr_util.py \
            --critical backend/security.py \
            --critical backend/jobs.py \
            --critical backend/agents/reconciliation.py \
            --critical backend/platform/redis_cache.py \
            --critical backend/platform/durable_worker.py \
            --critical backend/platform/webhook_delivery.py
      - name: Verify published test-count claims against the collected suite
        run: python scripts/check_claim_counts.py
      - name: Verify benchmark evidence
        run: |
          python scripts/benchmark_manifest_check.py
          python scripts/benchmark_hash_sources.py
          python scripts/benchmark_calibration.py
          git diff --exit-code benchmarks/ps4_external_v1/reports/calibration_report.md benchmarks/ps4_external_v1/reports/calibration.json
          python eval/run_eval.py
          python eval/multi_project_eval.py
          python eval/text_eval.py
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage-backend.xml
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.109.1
      - name: Rebuild migrations from an empty database
        run: |
          supabase db start
          supabase db reset --local
          supabase migration list --local
      - name: Lint schema, exercise RLS, and run database advisors
        run: |
          supabase db lint --local --schema public,private --fail-on error
          supabase test db --local
          supabase db advisors --local --type security --fail-on warn
          supabase db advisors --local --type performance --fail-on warn
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Type, component coverage, audit, and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run quality:design
          npm run test:coverage
          npm audit --audit-level=high
          npm run build
          npm run quality:bundle
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked backend runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and browser engines
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
      - name: Chromium, Firefox, WebKit, Pixel, and iPhone journeys
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build non-root digest-pinned images
        run: |
          docker build -f Dockerfile.backend -t pramaan-backend:${{ github.sha }} .
          docker build --target frontend -t pramaan-frontend:${{ github.sha }} .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pramaan-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pramaan-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Smoke-test backend health and OCR
        run: |
          docker run -d --name pramaan-test -p 8000:8000 pramaan-backend:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health/ready && break || sleep 2; done
          curl -sf http://localhost:8000/ocr-check | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ready', d"
          docker stop pramaan-test

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: pramaan-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pramaan-sbom
          path: pramaan-sbom.cdx.json
          retention-days: 30
