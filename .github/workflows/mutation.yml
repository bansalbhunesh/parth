name: Critical-path mutation testing

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

jobs:
  mutmut:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked application and mutation toolchain
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Run configured critical-path mutations
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_ps4_hardening.py \
            --ignore=tests/test_schedule_data.py \
            --ignore=tests/test_schedule_risk.py \
            --cov=backend --cov-branch \
            --cov-report=json:coverage-mutation-preflight.json
          python scripts/check_coverage_thresholds.py coverage-mutation-preflight.json \
            --lines 0 --branches 0 \
            --critical backend/security.py \
            --critical backend/jobs.py \
            --critical backend/agents/reconciliation.py \
            --critical backend/platform/redis_cache.py \
            --critical backend/platform/durable_worker.py \
            --critical backend/platform/webhook_delivery.py
          mutmut run --max-children 4
          mutmut results --all | tee mutation-results.txt
          python scripts/check_mutation_score.py mutation-results.txt --minimum 85 --json-output mutation-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            mutation-summary.json
            coverage-mutation-preflight.json
            mutants/
          retention-days: 30
