name: Critical-path mutation testing

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

jobs:
  mutmut:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked application and mutation toolchain
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Run configured critical-path mutations
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_ps4_hardening.py \
            --ignore=tests/test_schedule_data.py \
            --ignore=tests/test_schedule_risk.py \
            --deselect=tests/test_api.py::TestStreamingEndpoints::test_copilot_stream_returns_sse \
            --deselect=tests/test_api.py::TestStreamingEndpoints::test_analyze_stream_returns_sse \
            --deselect=tests/test_api.py::TestPdfUploadEndpoints::test_upload_stream_text_files \
            --deselect=tests/test_architecture.py::test_backend_architecture_gates_pass \
            --deselect=tests/test_ps4_api.py::TestScheduleEndpoint::test_available_shape \
            --cov=backend --cov-branch \
            --cov-report=json:coverage-mutation-preflight.json
          python scripts/check_coverage_thresholds.py coverage-mutation-preflight.json \
            --lines 0 --branches 0 \
            --critical backend/security.py \
            --critical backend/jobs.py \
            --critical backend/agents/reconciliation.py \
            --critical backend/platform/redis_cache.py \
            --critical backend/platform/durable_worker.py \
            --critical backend/platform/webhook_delivery.py
          mutmut run --max-children 4
          python scripts/check_mutation_score.py mutants --minimum 85 \
            --results-output mutation-results.txt \
            --json-output mutation-summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.txt
            mutation-summary.json
            coverage-mutation-preflight.json
            mutants/
          retention-days: 30
