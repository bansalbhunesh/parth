version: "3.9"

services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8099:8099"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PRAMAAN_LLM=${PRAMAAN_LLM:-gemini}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API=http://backend:8099
    depends_on:
      backend:
        condition: service_healthy
