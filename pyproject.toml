[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan"
version = "2.0.0"
description = "EPC Deviation Intelligence — Spec-to-Site Deviation Sentinel for hyperscale data-centre delivery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "google-genai>=1.0,<3.0",
    "anthropic>=0.40,<1.0",
    "langgraph>=0.2,<2.0",
    "numpy>=1.26,<3.0",
    "networkx>=3.0,<4.0",
    "pymupdf>=1.24,<2.0",
    "pdfplumber>=0.10,<1.0",
    "pytesseract>=0.3.10,<1.0",
    # Floor covers the 2026 Pillow advisory set fixed in 12.2.0; pip-audit
    # flagged 7 open advisories on the previously-allowed 11.3.0. Public
    # demo decodes untrusted image/PDF uploads.
    "Pillow>=12.2,<13.0",
    "httpx>=0.27,<1.0",
    # Explicit security floor for the multipart upload parser (transitive via
    # FastAPI). <0.0.31 has several parsing DoS CVEs (CVE-2026-40347/42561/
    # 53538-53540); pin the patched floor since Phase 5 hardens the upload path.
    "python-multipart>=0.0.31",
    # Toolchain floor: PYSEC-2026-3447 (fixed 83.0.0) — CI's pip-audit gates
    # on the runner venv's setuptools, so the floor lives with the app deps.
    "setuptools>=83.0.0",
    # Pure-Python (no Pango/Cairo system deps, unlike WeasyPrint) - chosen
    # specifically so the ITP PDF export doesn't add a Docker/Render build risk.
    "fpdf2>=2.7,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "redis>=6.0,<7.0",
    "openai>=1.0",
    "opentelemetry-api>=1.36,<2.0",
    "opentelemetry-sdk>=1.36,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1.0",
]

[project.optional-dependencies]
# Floor covers Python 3.14: pytest-asyncio <0.25 calls the now-deprecated
# asyncio.iscoroutinefunction() internally on every collected test (not just
# async ones), which floods -q output with DeprecationWarnings under 3.14's
# stricter warning filters. >=1.4 supports the current pytest major line.
dev = [
    # PYSEC-2026-1845 is fixed in 9.0.3. The test runner executes repository
    # and plugin-controlled code in CI, so dev-only status is not an excuse
    # to leave a known vulnerability in the locked toolchain.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    # Starlette 1.2 uses httpx2 for TestClient; keeping this explicit removes
    # its plain-httpx deprecation path so warnings can fail CI.
    "httpx2>=2.0,<3.0",
    "mypy>=1.18,<2.0",
    "radon>=6.0,<7.0",
    "import-linter>=2.9,<3.0",
    "pip-audit>=2.9,<3.0",
    "bandit>=1.8,<2.0",
    "mutmut>=3.5,<4.0",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/platform", "backend/http.py", "backend/versioning.py"]

[[tool.mypy.overrides]]
module = [
    "jwt",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "psycopg",
    "psycopg.*",
    "psycopg_pool",
    "redis",
    "redis.*",
]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["backend/"]
# Mutmut executes the suite from an isolated ``mutants/`` tree.  The tests are
# deliberately repository-wide: they import our gate helpers and validate the
# reviewed API contract, fixtures, migrations, benchmark evidence, and public
# claims.  Copy every non-package surface those tests require so mutation stats
# exercise the real suite instead of aborting (or, worse, running a weakened
# subset) in the isolated tree.
also_copy = [
    "scripts/",
    "eval/",
    "data/",
    "benchmarks/",
    "contracts/",
    "docs/",
    "supabase/",
    "frontend/app/",
    "frontend/components/",
    "frontend/lib/",
    ".gitignore",
    "README.md",
    "PITCH.md",
    "COMPETITIVE.md",
    "presentation.html",
]
# Mutmut 3 replays pytest inside one process while collecting per-test call
# maps.  NumPy's compiled core intentionally refuses that reload pattern.  The
# only collection-time NumPy imports are schedule-engine tests; neither touches
# the six mutation targets below.  The workflow independently proves those
# targets retain 100% line/branch coverage with this exact selection before it
# accepts a mutation score.
pytest_add_cli_args_test_selection = [
    "--ignore=tests/test_ps4_hardening.py",
    "--ignore=tests/test_schedule_data.py",
    "--ignore=tests/test_schedule_risk.py",
    "--deselect=tests/test_api.py::TestStreamingEndpoints::test_copilot_stream_returns_sse",
    "--deselect=tests/test_api.py::TestStreamingEndpoints::test_analyze_stream_returns_sse",
    "--deselect=tests/test_api.py::TestStreamingEndpoints::test_analyze_stream_result_carries_decision_loop_blocks",
    "--deselect=tests/test_api.py::TestPdfUploadEndpoints::test_upload_stream_text_files",
    "--deselect=tests/test_architecture.py::test_backend_architecture_gates_pass",
    "--deselect=tests/test_ps4_api.py::TestScheduleEndpoint::test_available_shape",
]
only_mutate = [
    "backend/security.py",
    "backend/jobs.py",
    "backend/agents/reconciliation.py",
    "backend/platform/redis_cache.py",
    "backend/platform/durable_worker.py",
    "backend/platform/webhook_delivery.py",
]
mutate_only_covered_lines = true
# Pin Mutmut's bounded detection window so timeout results are reproducible and
# mean the mutated behavior exceeded 15x its measured tests plus one second.
timeout_multiplier = 15.0
timeout_constant = 1.0
# Mutmut 3.6 resolves every traversed frame with strict=True while collecting
# coverage stats. Finite filtering can reach Python's synthetic
# ``<frozen importlib._bootstrap>`` frame and abort before any mutant runs.
# -1 disables that fragile caller-depth filter while retaining covered-line
# selection through mutate_only_covered_lines.
max_stack_depth = -1

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Silences pytest-asyncio's PytestDeprecationWarning about this option being
# unset. "function" matches how the suite is actually structured: every
# fixture in tests/conftest.py (e.g. the autouse _reset_process_state) is
# function-scoped, so function-scoped event loops per test is the correct,
# already-implicit behavior — this just makes it explicit.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Corpus generator: long standards-text literals are data, not code style.
"data/generate_projects.py" = ["E501"]
# Benchmark seed authoring: long owner/submittal document literals are data.
"scripts/benchmark_seed_pairs.py" = ["E501"]
