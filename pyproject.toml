[project]
name = "pramaan"
version = "2.0.0"
description = "EPC Deviation Intelligence — Spec-to-Site Deviation Sentinel for hyperscale data-centre delivery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "google-genai>=1.0,<3.0",
    "anthropic>=0.40,<1.0",
    "langgraph>=0.2,<2.0",
    "pymupdf>=1.24,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
