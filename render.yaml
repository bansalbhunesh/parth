services:
  - type: web
    name: pramaan-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # --- LLM via Google's native Gemini API (free tier) ---
      # The ONLY thing to set by hand in the Render dashboard is GEMINI_API_KEY
      # (an AI Studio key). gemini-2.5-flash is on the free tier; gemini-2.0-flash
      # may return 429 on free keys, so we pin 2.5-flash. After the key is set,
      # verify with GET /llm-check (it makes one real call and reports errors).
      # PRAMAAN_LLM_TIMEOUT caps the wait before the rule-based fallback kicks in.
      - key: PRAMAAN_LLM
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PRAMAAN_LLM_TIMEOUT
        value: "60"
      - key: GEMINI_API_KEY
        sync: false   # set this secret in the Render dashboard
      # --- Automatic failover leg: OpenAI-compatible Qwen gateway (OpenRouter) ---
      # Gemini stays PRIMARY (PRAMAAN_LLM=gemini above). If Gemini quota/429s
      # or times out, complete() fails over to this gateway automatically, then
      # to the rule-engine floor. Only active once OPENAI_API_KEY is set below —
      # until then the chain is [gemini] and behaviour is unchanged.
      # Verified 2026-07-03: qwen3-235b scored 9/11 (0.82) on the real pairs.
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3-235b-a22b-2507
      - key: OPENAI_JSON_MODE
        value: "1"
      - key: OPENAI_MAX_TOKENS
        value: "4000"   # gateways default low and truncate multi-finding JSON
      - key: OPENAI_API_KEY
        sync: false   # set the OpenRouter key (sk-or-...) in the Render dashboard
