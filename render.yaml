services:
  - type: web
    name: pramaan-backend
    # Docker runtime (was: runtime: python). The native Python buildpack cannot
    # apt-install system packages, so scanned-PDF / image OCR (which needs the
    # `tesseract` binary) was a silent no-op on the hosted demo. Dockerfile.backend
    # apt-installs tesseract-ocr, so building from it makes OCR actually work here.
    # NOTE (deploy): after merging this, redeploy and confirm the live URL still
    # serves (GET /health, and GET /ocr-check should report "status":"ready").
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      # --- LLM via Google's native Gemini API (free tier) ---
      # The ONLY thing to set by hand in the Render dashboard is GEMINI_API_KEY
      # (an AI Studio key). gemini-2.5-flash is on the free tier; gemini-2.0-flash
      # may return 429 on free keys, so we pin 2.5-flash. After the key is set,
      # verify with GET /llm-check (it makes one real call and reports errors).
      # PRAMAAN_LLM_TIMEOUT caps the wait before the rule-based fallback kicks in.
      - key: PRAMAAN_LLM
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PRAMAAN_LLM_TIMEOUT
        value: "60"
      # Explicit, deterministic failover order for the hosted demo. Ollama is a
      # LOCAL leg (needs a local daemon), so it is intentionally NOT listed here
      # — hosted Render has no Ollama, and it stays filtered out regardless.
      # The env keys below use the older OPENAI_*/GROQ_* names; the code also
      # accepts the canonical QWEN_GATEWAY_*/CLAUDE_* names (see .env.example).
      # Gateway leg FUNDED via aicredits.in (2026-07-06, key verified live) and
      # pinned to google/gemini-3.1-flash-lite — the exact benchmark-featured
      # model — so the canonical order gemini,qwen,groq,claude is restored (the
      # first failover lands on the featured configuration). The Claude leg
      # stays inert until CLAUDE_API_KEY/ANTHROPIC_API_KEY is set. The paid leg
      # is spend-guarded by OPENAI_BUDGET_PER_HOUR below. NOTE: the live
      # service's env is dashboard-managed - edits here do NOT auto-apply;
      # change values in the Render dashboard as well, then Manual Deploy and
      # confirm with /llm-check?probe_all=1.
      - key: PRAMAAN_LLM_PROVIDER_ORDER
        value: gemini,qwen,groq,claude
      - key: GEMINI_API_KEY
        sync: false   # set this secret in the Render dashboard
      # --- Automatic failover leg: OpenAI-compatible gateway (aicredits.in) ---
      # Gemini stays PRIMARY (PRAMAAN_LLM=gemini above). If Gemini quota/429s,
      # times out, or returns unparseable JSON, the chain fails over here, then
      # to Groq, then the rule-engine floor. Only active once OPENAI_API_KEY is
      # set — until then the leg is filtered out and behaviour is unchanged.
      - key: OPENAI_BASE_URL
        value: https://aicredits.in/v1
      - key: OPENAI_MODEL
        value: google/gemini-3.1-flash-lite   # the benchmark-featured model
      - key: OPENAI_JSON_MODE
        value: "1"
      - key: OPENAI_MAX_TOKENS
        value: "4000"   # gateways default low and truncate multi-finding JSON
      # Spend guard for the PAID leg: at most this many gateway calls per hour
      # (process-local sliding window). Exhausted budget == leg failure -> the
      # chain walks on to Groq / the free rule floor; the demo never breaks,
      # the bill stays capped (~Rs 0.3 per reconcile-sized call at current
      # aicredits pricing => worst case a few rupees/hour).
      - key: OPENAI_BUDGET_PER_HOUR
        value: "30"
      - key: OPENAI_API_KEY
        sync: false   # set the aicredits key (sk-live-...) in the Render dashboard
      # --- Second failover leg: Groq (free tier, its own quota) for full
      # insurance. Chain: gemini -> qwen gateway -> groq -> rule floor. Groq
      # has good recall but a mild over-flag tendency, so it sits behind the
      # cleaner Qwen. Inert until GROQ_API_KEY is set. ---
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false   # set the Groq key (gsk_...) in the Render dashboard
      # --- Public-demo security hardening (Phase 5) ---
      # Rate limiting ON with generous per-hour caps (process-local; single
      # instance). Demo token auth OFF by default so judges get an open demo —
      # flip DEMO_AUTH_ENABLED=true and set DEMO_AUTH_TOKEN (as a synced secret)
      # only if the demo starts getting abused. See docs/SECURITY_DEMO_RUNBOOK.md.
      - key: PRAMAAN_RATE_LIMIT_ENABLED
        value: "true"
      - key: PRAMAAN_ANALYSIS_LIMIT_PER_HOUR
        value: "20"
      - key: PRAMAAN_UPLOAD_LIMIT_PER_HOUR
        value: "10"
      - key: PRAMAAN_DEEP_PROBE_LIMIT_PER_HOUR
        value: "3"
      - key: PRAMAAN_MAX_UPLOAD_MB
        value: "20"
      - key: DEMO_AUTH_ENABLED
        value: "false"
      # - key: DEMO_AUTH_TOKEN
      #   sync: false   # set only if DEMO_AUTH_ENABLED is flipped to true
